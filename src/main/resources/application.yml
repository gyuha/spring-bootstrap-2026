spring:
  application:
    name: baseline

  # PLAT-01: 가상 스레드 활성화 (Spring Boot 3.2+ Tomcat/MVC 자동 적용)
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/baseline
    username: baseline
    password: baseline
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway가 스키마를 관리하므로 create/update 금지 — 정합성만 검증
      ddl-auto: validate
    show-sql: false
    open-in-view: false   # OSIV off — 계층 경계 유지 (View 렌더링 중 세션 열림 방지)
    properties:
      hibernate:
        format_sql: false

  flyway:
    # flyway-database-postgresql이 클래스패스에 있어 별도 url 불필요
    locations: classpath:db/migration
    baseline-on-migrate: false   # greenfield — 기존 DB 없음
    validate-on-migrate: true

  data:
    redis:
      # Phase 1: 비밀번호 없음 (로컬 개발), Lettuce 클라이언트 기본 사용
      host: localhost
      port: 6379

  # Phase 3 (NFR-02): HTTP 세션을 Redis 에 영속화 → OAuth2AuthorizedClient(토큰)가
  # HttpSession attribute 로 저장되어 Redis 서버 측에만 들어간다(쿠키엔 SESSION ID 만).
  # 직렬화는 기본 JDK 유지(JSON 전환 시 OAuth2/OIDC 역직렬화 깨짐 — Pitfall 1).
  # OIDC client registration/provider 는 main 에 두지 않는다(빈 placeholder 가 eager issuer
  # discovery 를 유발해 부팅을 깨뜨림). test/배포 프로파일에서만 정의.
  session:
    store-type: redis
    redis:
      namespace: "spring:session:baseline"

mybatis:
  configuration:
    # created_at → createdAt 등 snake_case 컬럼을 camelCase 프로퍼티로 자동 매핑
    map-underscore-to-camel-case: true

springdoc:
  # T-02 보안 주의: Swagger UI / api-docs는 dev 전용. 운영 배포 전 반드시
  # springdoc.api-docs.enabled=false로 비활성화하거나 인증 뒤로 격리할 것
  # (BFF/NFR-02 — 액세스 토큰 브라우저 비노출 원칙). Spring Security 도입(Phase 3/4) 후 인가 연동.
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # dev-only — 운영 배포 전 when_authorized로 변경 필요 (T-01 보안 주의)
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: false   # Phase 1: 불필요

logging:
  level:
    com.anchors.baseline: DEBUG
    org.flywaydb: INFO
