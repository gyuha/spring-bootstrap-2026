[versions]
spring-boot = "3.5.3"
mybatis-spring-boot = "3.0.4"
archunit = "1.4.1"
testcontainers = "1.21.3"
lombok = "1.18.38"
springdoc = "2.8.9"   # springdoc 2.8.x → Spring Boot 3.5.x 호환

[libraries]
# MyBatis (Spring Boot BOM 관리 밖 — 3.0.4 고정, 4.0.0 금지)
mybatis-spring-boot-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis-spring-boot" }

# ArchUnit
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# Testcontainers (Spring Boot BOM에서 버전 관리)
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }

# springdoc-openapi (Swagger UI + OpenAPI 3) — 추가 문서화 스펙
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
