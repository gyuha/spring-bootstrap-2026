# 로컬 개발 전용 Docker Compose — 운영 환경 사용 금지
services:
  postgres:
    image: postgres:16
    environment:
      # local-dev-only credentials, not for prod
      POSTGRES_DB: baseline
      POSTGRES_USER: baseline
      POSTGRES_PASSWORD: baseline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseline -d baseline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
