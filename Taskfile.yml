# Taskfile.yml — 프로젝트 개발 커맨드 모음 (go-task: https://taskfile.dev)
#
# 사용법:
#   task            # 사용 가능한 task 목록 출력 (default)
#   task <이름>     # 특정 task 실행 (예: task test)
#   task --list     # 설명과 함께 목록 보기
#
# 전제: go-task(`task`) 설치. 미설치 시: `brew install go-task` (macOS).
# 빌드는 Gradle wrapper(./gradlew)를 사용하며 Java 21 toolchain은 Gradle이 자동 처리한다.

version: '3'

# ---------------------------------------------------------------------------
# 변수 — 환경변수로 오버라이드 가능 (예: DB_PORT=5433 task infra:up)
# ---------------------------------------------------------------------------
vars:
  GRADLE: ./gradlew                 # Gradle wrapper (8.14.3 고정)
  COMPOSE: docker compose           # 로컬 인프라(PostgreSQL + Redis)
  POSTGRES_DB: '{{.POSTGRES_DB | default "baseline"}}'
  POSTGRES_USER: '{{.POSTGRES_USER | default "baseline"}}'
  DB_PORT: '{{.DB_PORT | default "5432"}}'
  REDIS_PORT: '{{.REDIS_PORT | default "6379"}}'
  SERVER_PORT: '{{.SERVER_PORT | default "8080"}}'

tasks:
  # =========================================================================
  # 기본 — 인자 없이 `task` 실행 시 task 목록을 보여준다
  # =========================================================================
  default:
    desc: 사용 가능한 task 목록을 출력합니다
    cmds:
      - task --list
    silent: true

  # =========================================================================
  # 빌드 / 컴파일 / 정리
  # =========================================================================
  build:
    desc: 전체 빌드를 실행합니다 (컴파일 + 테스트 + 패키징)
    cmds:
      - '{{.GRADLE}} build'

  compile:
    desc: 메인 소스만 컴파일합니다 (빠른 문법 확인)
    cmds:
      - '{{.GRADLE}} compileJava'

  clean:
    desc: 빌드 산출물(build/)을 정리합니다
    cmds:
      - '{{.GRADLE}} clean'

  deps:
    desc: 의존성 트리를 출력합니다 (compileClasspath)
    cmds:
      - '{{.GRADLE}} dependencies --configuration compileClasspath'

  # =========================================================================
  # 테스트 — 통합 테스트는 Docker(Testcontainers)가 필요하다
  # =========================================================================
  test:
    desc: 전체 테스트 스위트를 실행합니다 (Testcontainers — Docker 필요)
    cmds:
      - '{{.GRADLE}} test'

  test:arch:
    desc: ArchUnit 계층 의존 방향 게이트만 실행합니다 (Docker 불필요, 빠름)
    cmds:
      - '{{.GRADLE}} test --tests "*ArchitectureTest*"'

  check:
    desc: 컴파일 + 전체 테스트를 한 번에 검증합니다
    cmds:
      - task: compile
      - task: test

  # =========================================================================
  # 로컬 인프라 (Docker Compose — PostgreSQL + Redis)
  # =========================================================================
  infra:up:
    desc: PostgreSQL + Redis 컨테이너를 백그라운드로 기동합니다
    cmds:
      - '{{.COMPOSE}} up -d'

  infra:down:
    desc: 인프라 컨테이너를 중지/제거합니다 (데이터 볼륨 유지)
    cmds:
      - '{{.COMPOSE}} down'

  infra:reset:
    desc: 인프라를 볼륨까지 완전히 제거합니다 (DB 초기화 — 주의)
    cmds:
      - '{{.COMPOSE}} down -v'

  infra:logs:
    desc: 인프라 컨테이너 로그를 따라갑니다 (Ctrl+C로 종료)
    cmds:
      - '{{.COMPOSE}} logs -f'

  infra:ps:
    desc: 인프라 컨테이너 상태/헬스를 확인합니다
    cmds:
      - '{{.COMPOSE}} ps'

  # =========================================================================
  # 애플리케이션 실행
  # =========================================================================
  run:
    desc: 인프라 기동 후 애플리케이션을 실행합니다 (가장 일반적인 진입점)
    cmds:
      - task: infra:up
      - task: bootRun

  bootRun:
    desc: 애플리케이션만 실행합니다 (인프라가 이미 떠 있어야 함). 포트 변경 — SERVER_PORT=8090 task bootRun
    cmds:
      # --server.port 를 program arg(최고 우선순위)로 전달 → SERVER_PORT 변수로 포트 변경 가능
      - '{{.GRADLE}} bootRun --args="--server.port={{.SERVER_PORT}}"'

  # =========================================================================
  # DB / Redis 셸 — 디버깅용 (인프라가 떠 있어야 함)
  # =========================================================================
  db:psql:
    desc: PostgreSQL psql 셸에 접속합니다
    cmds:
      - '{{.COMPOSE}} exec postgres psql -U {{.POSTGRES_USER}} -d {{.POSTGRES_DB}}'

  redis:cli:
    desc: Redis CLI에 접속합니다
    cmds:
      - '{{.COMPOSE}} exec redis redis-cli'

  # =========================================================================
  # 문서 — Swagger UI / OpenAPI (앱이 실행 중이어야 접근 가능)
  # =========================================================================
  swagger:
    desc: Swagger UI / OpenAPI 문서 URL을 안내합니다 (앱 실행 필요)
    cmds:
      - 'echo "Swagger UI : http://localhost:{{.SERVER_PORT}}/swagger-ui.html"'
      - 'echo "OpenAPI    : http://localhost:{{.SERVER_PORT}}/v3/api-docs"'
    silent: true

  # =========================================================================
  # 헬스체크 — Actuator (앱이 실행 중이어야 함, 200/UP 확인)
  # =========================================================================
  health:
    desc: Actuator 헬스 엔드포인트를 호출합니다 (app/db/redis 상태)
    cmds:
      - 'curl -s http://localhost:{{.SERVER_PORT}}/actuator/health'
    silent: true
